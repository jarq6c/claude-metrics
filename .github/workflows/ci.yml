name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          cache: true
      - name: Check formatting
        run: pixi run format-check
      - name: Lint
        run: pixi run lint
      - name: Type check
        run: pixi run typecheck
      - name: Test
        run: pixi run test
      - name: Build docs
        run: pixi run docs
      - name: Build package
        run: pixi run build
