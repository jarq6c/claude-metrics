site_name: hydrodemo
site_description: Unit hydrograph modeling and GLUE calibration with synthetic data.
repo_url: https://github.com/jarq6c/claude-metrics

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - API reference: api.md
